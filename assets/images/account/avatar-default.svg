<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="">
    <!-- Repli tant qu'aucune photo n'a été déposée : silhouette générique,
         mêmes gris que le reste du site (jetons pl-border et
         pl-text-disabled, design-system.css). Un carré exact (viewBox
