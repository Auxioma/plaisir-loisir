api_platform:
    title: Plaisir-Loisir API
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    # DDD léger : les ressources API vivent dans src/<Domaine>/ApiResource.
    mapping:
        paths:
            - '%kernel.project_dir%/src'
    # Formats activés (jsonld par défaut + json pour Angular, html pour la doc Swagger).
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']
