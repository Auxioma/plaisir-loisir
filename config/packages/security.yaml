security:
    # Hachage automatique des mots de passe (bcrypt/argon selon la plateforme).
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # L'utilisateur est chargé depuis l'entité User, identifié par son email.
    providers:
        app_user_provider:
            entity:
                class: App\User\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Authentification classique par formulaire HTML + sessions.
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _email
                password_parameter: _password
                enable_csrf: true
                default_target_path: app_home

            logout:
                path: app_logout
                target: app_home
                # Sans ce jeton, la déconnexion s'obtenait par un simple GET :
                # un site tiers affichant <img src="…/logout"> déconnectait le
                # visiteur à son insu. L'écran de confirmation poste désormais
                # un formulaire portant « _csrf_token ».
                enable_csrf: true

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 1 semaine
                path: /

    # Règles d'accès (la première qui correspond s'applique).
    #
    # Rappel : tout chemin qui ne figure PAS dans cette liste est accessible
    # sans compte. Le catalogue, les destinations, les offres, les cadeaux, les
    # pages institutionnelles et les écrans d'authentification restent donc
    # publics sans qu'il faille les énumérer.
    access_control:
        # Écrans d'authentification : accessibles justement quand on n'est pas
        # connecté. Ils sont listés explicitement pour rester lisibles.
        #
        # Ces règles portent sur des CHEMINS, pas sur des noms de route : chaque
        # page traduite doit donc y figurer dans ses deux langues. Oublier la
        # variante anglaise d'une règle ROLE_USER ouvrirait la page au public.
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/(inscription|en/signup)$, roles: PUBLIC_ACCESS }
        - { path: ^/(authentification|en/authentication), roles: PUBLIC_ACCESS }
        - { path: ^/(mot-de-passe-oublie|en/forgot-password), roles: PUBLIC_ACCESS }

        # Espace compte. Les règles précédentes visaient « ^/account » et
        # « ^/provider », deux préfixes qui ne correspondent à AUCUNE route :
        # /compte/favoris, /compte/notifications et /compte/parrainage étaient
        # donc consultables par n'importe quel visiteur. Corrigé au câblage.
        - { path: ^/(compte|en/account), roles: ROLE_USER }

        # Réservé à l'administration ; aucune route n'existe encore, la règle
        # est posée pour que le préfixe ne puisse pas s'ouvrir par inadvertance.
        - { path: ^/admin, roles: ROLE_ADMIN }

        # L'espace professionnel (ROLE_PROVIDER) viendra avec le « mode Pro » :
        # il aura sa règle quand ses routes existeront. En protéger un préfixe
        # imaginaire ne protège rien.

when@test:
    security:
        password_hashers:
            # Hachage allégé en test pour accélérer la suite.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
