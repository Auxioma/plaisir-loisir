security:
    # Connexion (05/10) : on distingue « aucun compte avec cette adresse » de
    # « mot de passe incorrect », à la demande du client — un message unique
    # rendait le parcours incompréhensible. Contrepartie : un tiers peut
    # savoir si une adresse est inscrite ; c'est pourquoi les tentatives sont
    # limitées (login_throttling ci-dessous, et limiteur sur le mot de passe
    # oublié dans framework.yaml).
    expose_security_errors: all

    # Hachage automatique des mots de passe (bcrypt/argon selon la plateforme).
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # L'utilisateur est chargé depuis l'entité User, identifié par son email.
    providers:
        app_user_provider:
            entity:
                class: App\User\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            # 5 essais par adresse et par IP toutes les 15 minutes. Les tests
            # enchaînent les connexions depuis la même IP : le limiteur est
            # neutralisé en test (config/packages/rate_limiter.yaml).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # Refuse la connexion aux comptes suspendus et supprimés. Sans
            # cette ligne, le statut de l'entité User n'était vérifié NULLE
            # PART : suspendre un compte depuis le back-office ne l'aurait
            # pas empêché de se connecter.
            user_checker: App\User\Security\AccountChecker

            # Authentification classique par formulaire HTML + sessions.
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _email
                password_parameter: _password
                enable_csrf: true
                default_target_path: app_home
                # Sans ce handler, default_target_path s'appliquait aussi aux
                # administrateurs : connexion depuis /login → accueil public,
                # /admin à taper soi-même dans la barre d'adresse.
                success_handler: App\User\Security\LoginSuccessHandler

            # Compte connecté sans les droits de la page (ex. client sur
            # /admin) : retour sur son propre espace avec un message, au lieu
            # d'une erreur 403 brute.
            access_denied_handler: App\User\Security\AccessDeniedHandler

            logout:
                path: app_logout
                target: app_home
                # Sans ce jeton, la déconnexion s'obtenait par un simple GET :
                # un site tiers affichant <img src="…/logout"> déconnectait le
                # visiteur à son insu. L'écran de confirmation poste désormais
                # un formulaire portant « _csrf_token ».
                enable_csrf: true

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 1 semaine
                path: /

    # Règles d'accès (la première qui correspond s'applique).
    #
    # Rappel : tout chemin qui ne figure PAS dans cette liste est accessible
    # sans compte. Le catalogue, les destinations, les offres, les cadeaux, les
    # pages institutionnelles et les écrans d'authentification restent donc
    # publics sans qu'il faille les énumérer.
    access_control:
        # Écrans d'authentification : accessibles justement quand on n'est pas
        # connecté. Ils sont listés explicitement pour rester lisibles.
        #
        # Ces règles portent sur des CHEMINS, pas sur des noms de route : chaque
        # page traduite doit donc y figurer dans ses deux langues. Oublier la
        # variante anglaise d'une règle ROLE_USER ouvrirait la page au public.
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/(inscription|en/signup)$, roles: PUBLIC_ACCESS }
        - { path: ^/(authentification|en/authentication), roles: PUBLIC_ACCESS }
        - { path: ^/(mot-de-passe-oublie|en/forgot-password), roles: PUBLIC_ACCESS }
        # Un compte « en attente » ne peut pas se connecter (AccountChecker) :
        # cet écran doit donc rester joignable sans session (Lot I, 15/09).
        - { path: ^/(verification-email|en/verify-email), roles: PUBLIC_ACCESS }

        # Parcours d'authentification PROFESSIONNEL (maquette « Profesionnelle »,
        # bandeau AUTHENTIFICATIONS 01). Inscription en deux etapes, connexion,
        # mot de passe oublie : tout y est accessible sans compte, par
        # definition. Les deux langues sont listees, comme partout ici : ces
        # regles portent sur des chemins, pas sur des noms de route.
        - { path: ^/(pro|en/pro)/(inscription|signup|connexion|login|mot-de-passe-oublie|forgot-password), roles: PUBLIC_ACCESS }

        # Espace compte. Les règles précédentes visaient « ^/account » et
        # « ^/provider », deux préfixes qui ne correspondent à AUCUNE route :
        # /compte/favoris, /compte/notifications et /compte/parrainage étaient
        # donc consultables par n'importe quel visiteur. Corrigé au câblage.
        - { path: ^/(compte|en/account), roles: ROLE_USER }

        # Réservé à l'administration ; aucune route n'existe encore, la règle
        # est posée pour que le préfixe ne puisse pas s'ouvrir par inadvertance.
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Demandes reçues, abonnement, tableau de bord et fiche personnelle
        # côté professionnel (§8.3, §10, §11, §17 du CDC). /professionnels
        # (recherche publique, fiche publique) reste volontairement hors de
        # cette liste : c'est un écran public, sans compte.
        # Espace professionnel complet (maquettes profil_professionnel, 02/10) :
        # tout /pro/* hors parcours d'authentification (règle publique plus haut).
        - { path: ^/(pro|en/pro)/, roles: ROLE_PROVIDER }

        # Assistant de création d'événement (le guide /evenements/creer reste public).
        - { path: ^/(evenements/creer/|en/events/create/), roles: ROLE_USER }

        # Tunnel de réservation : récapitulatif, paiement, confirmation (03/10).
        - { path: ^/(reservations|en/bookings)/, roles: ROLE_USER }

        # « Mes favoris » du menu principal (01/10).
        - { path: ^/(mes-favoris|en/my-favourites), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hachage allégé en test pour accélérer la suite.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
