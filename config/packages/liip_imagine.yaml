# Copies compressées des photos déposées (public/uploads/), via LiipImagineBundle.
#
# L'original n'est jamais modifié. Au premier affichage, Liip génère la copie
# (route _liip_imagine) dans public/media/cache/<filtre>/uploads/…, puis le
# serveur web la sert directement. Branchement : App\Shared\Image\ResizedUploadPackage
# (tout asset('uploads/…') → filtre « web ») et la fonction Twig image_url().
#
# Aucun filtre ne recadre (sauf l'avatar, carré) : le CSS (object-fit) garde la
# main sur le cadrage. Aucun agrandissement : une petite image reste telle quelle.
# auto_rotate redresse les photos de téléphone (EXIF) ; strip retire les
# métadonnées, dont la position GPS.
#
# Driver : GD en local, Imagick en production.
liip_imagine:
    driver: gd

    # Après remplacement d'une photo, ses copies sont supprimées
    # (UploadedImageUrl::forget) ; pour tout régénérer : liip:imagine:cache:remove
    filter_sets:
        # Toute photo affichée en grand (fiche, galerie, bannière, og:image)
        web:
            jpeg_quality: 82
            png_compression_level: 8
            quality: 82
            filters:
                auto_rotate: ~
                strip: ~
                thumbnail: { size: [1920, 1920], mode: inset, allow_upscale: false }
                interlace: { mode: line }

        # Vignettes des cartes et listes
        card:
            jpeg_quality: 80
            png_compression_level: 8
            quality: 80
            filters:
                auto_rotate: ~
                strip: ~
                thumbnail: { size: [800, 800], mode: inset, allow_upscale: false }
                interlace: { mode: line }

        # Photo de profil (carrée, nette en écran haute densité)
        avatar:
            jpeg_quality: 85
            png_compression_level: 8
            quality: 85
            filters:
                auto_rotate: ~
                strip: ~
                thumbnail: { size: [256, 256], mode: outbound, allow_upscale: false }

when@prod:
    liip_imagine:
        driver: imagick
