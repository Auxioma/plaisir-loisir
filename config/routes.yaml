# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

# Ancienne adresse d'inscription. /register etait un chemin anglais servant une
# page francaise ; elle vaut desormais /inscription. La redirection est
# permanente (301) pour que les moteurs de recherche transferent l'anciennete
# de la page au lieu de la perdre.
legacy_register:
    path: /register
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: app_register
        permanent: true
        # /register?type=pro menait au formulaire professionnel : sans cette
        # option, la redirection perdrait le type et renverrait le visiteur
        # sur le formulaire particulier.
        keepQueryParams: true
