# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Valeurs par défaut des variables ajoutées après coup : un serveur dont
    # le .env.local.php (composer dump-env) est antérieur ne doit pas tomber
    # sur « Environment variable not found » (CD #16, 04/10).
    # Limites anti-abus et verrous (05/10) : valeurs par défaut si le serveur
    # ne les définit pas (le CD a déjà échoué sur une variable manquante).
    env(PASSWORD_RESET_REQUEST_LIMIT): '5'
    env(LOCK_DSN): 'flock'
    # Réseaux sociaux officiels confirmés par le client le 20/10 ; une valeur
    # vide masque l'icône correspondante.
    env(SOCIAL_FACEBOOK_URL): 'https://www.facebook.com/profile.php?id=61592879935680'
    env(SOCIAL_INSTAGRAM_URL): 'https://www.instagram.com/trouvemoi67/'
    env(SOCIAL_TIKTOK_URL): ''
    env(SOCIAL_YOUTUBE_URL): ''
    env(SOCIAL_LINKEDIN_URL): ''
    env(STRIPE_SECRET_KEY): ''
    env(STRIPE_CONNECT_WEBHOOK_SECRET): ''
    env(PAYPAL_PARTNER_ATTRIBUTION_ID): ''
    env(PAYPAL_WEBHOOK_ID): ''
    env(PAYPAL_PARTNER_ID): ''
    env(PAYPAL_CLIENT_ID): ''
    env(PAYPAL_CLIENT_SECRET): ''
    env(PAYPAL_MODE): 'sandbox'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Adresse d'Elasticsearch injectée dans les services de recherche/indexation.
            string $elasticsearchUrl: '%env(ELASTICSEARCH_URL)%'
            # Secret de signature du webhook Stripe (vérifie l'authenticité des appels).
            string $stripeWebhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
            # Racine du projet (graine de traductions, fichiers témoins).
            string $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Abonnements professionnels (§17 du CDC), seuls paiements encaissés par
    # TrouveMoi : Stripe dès qu'une clé `sk_…` est configurée, simulation
    # sinon (voir ConfiguredSubscriptionGateway). Les prestations, elles, sont
    # réglées directement au professionnel et ne passent jamais par ici.
    App\Payment\Stripe\SubscriptionGateway: '@App\Payment\Stripe\ConfiguredSubscriptionGateway'

    # Paiement des réservations (20/10) : par carte sur le compte Stripe du
    # professionnel (Stripe Connect) ou sur son compte PayPal. Réels dès que
    # les clés sont là, simulés sinon hors production, indisponibles en prod.
    App\Payment\Stripe\ConnectGateway: '@App\Payment\Stripe\ConfiguredConnectGateway'
    App\Payment\PayPal\PayPalGateway: '@App\Payment\PayPal\ConfiguredPayPalGateway'

    # La recherche est codée contre l'interface SearchService ; aujourd'hui
    # résolue vers PostgreSQL (Elasticsearch la remplacera).
    App\Search\SearchService: '@App\Search\DatabaseSearch'

    # Client officiel Stripe, configuré avec la clé secrète (clé de TEST en dev).
    Stripe\StripeClient:
        arguments:
            $config: '%env(STRIPE_SECRET_KEY)%'

    # Paiement ponctuel sur la page hébergée de Stripe (achat d'un bon cadeau),
    # codé contre l'interface CheckoutGateway (testable via un stub).
    App\Payment\Stripe\CheckoutGateway: '@App\Payment\Stripe\StripeCheckoutGateway'

    # Traductions administrables en base (demande CTO) : le loader « db »
    # est branché sur les fichiers témoins translations/messages.{locale}.db.
    App\I18n\Translation\DatabaseTranslationLoader:
        tags:
            - { name: translation.loader, alias: db }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
