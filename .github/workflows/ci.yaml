name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Qualité & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, pdo_pgsql
          coverage: none

      - name: Valider composer.json
        run: composer validate --strict

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP-CS-Fixer (vérification, sans modifier)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      # Un var(--pl-…) inexistant invalide toute la déclaration CSS sans aucune
      # erreur visible : l'espacement disparaît en silence. Voir le script.
      - name: Jetons CSS (aucune variable --pl-* non déclarée)
        run: php bin/check-css-tokens.php

      # Les tests fonctionnels parcourent le site pour de vrai : il leur faut la
      # base et son schema. Doctrine y ajoute le suffixe « _test »
      # (config/packages/doctrine.yaml), les donnees de developpement ne sont
      # donc jamais touchees.
      - name: Preparer la base de test
        run: |
          php bin/console --env=test doctrine:database:create --if-not-exists -n
          php bin/console --env=test doctrine:schema:create -n
          php bin/console --env=test doctrine:fixtures:load -n

      - name: PHPUnit
        run: php bin/phpunit
