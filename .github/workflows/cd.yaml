name: CD

# ---------------------------------------------------------------------------
#  Déploie `master` sur le serveur Plesk (/var/www/vhosts/trouvemoi.eu/httpdocs)
#  dès que le workflow « CI » est vert sur `master`. Un push dont la CI échoue
#  n'est jamais déployé. On déploie exactement le commit validé par la CI.
#
#  Le code est récupéré par Git directement sur le serveur, avec le jeton
#  temporaire du workflow (aucune clé à installer sur le serveur). Au premier
#  passage, httpdocs (simple copie du projet) devient un dépôt Git : les
#  fichiers suivis sont remplacés, les autres (.env.local, vendor/, var/…)
#  sont conservés.
#
#  La connexion SSH se fait en root, mais tout le reste tourne sous
#  l'utilisateur système du site Plesk (SITE_USER), propriétaire des fichiers
#  et de PHP-FPM : sinon cache et vendor appartiendraient à root et le site
#  ne pourrait plus y écrire.
#
#  Secrets à définir dans GitHub (Settings > Secrets and variables > Actions) :
#    APP_HOST : hôte du serveur
#    APP_USER : utilisateur SSH
#    APP_PASS : mot de passe SSH
#    APP_PORT : port SSH (facultatif, 22 par défaut)
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Déploiement manuel de master (onglet Actions > CD > Run workflow), par
  # exemple quand la CI a été vérifiée mais que le déclenchement automatique
  # n'a pas eu lieu (panne des runners GitHub du 05/10).
  workflow_dispatch:

# Un seul déploiement à la fois ; un nouveau push annule celui en attente.
concurrency:
  group: deploy-trouvemoi
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Automatique : seulement après une CI verte. Manuel : seulement master.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      SSHPASS: ${{ secrets.APP_PASS }}
      SSH: sshpass -e ssh -q -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p ${{ secrets.APP_PORT || '22' }} ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}
      SITE_DIR: /var/www/vhosts/trouvemoi.eu/httpdocs
      SITE_USER: trouvemoi.eu_w3wfa542s9m

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # Un cache/prod périmé fait tomber le noyau à la première commande
      # console, cache:clear compris (« ApiPlatformBundle not found »,
      # voir docs/note-revue-11-08.md §6) : on le purge AVANT tout.
      # Des fichiers (var/, vendor/…) ont été créés par root lors d'installations
      # manuelles : l'utilisateur du site ne peut ni les modifier ni les
      # supprimer (composer échoue). On lui rend tout ce qui n'est pas à lui.
      - name: Purger le cache et rendre les fichiers au site
        run: |
          $SSH "set -e; cd $SITE_DIR; rm -rf var/cache/prod public/assets; find . -mindepth 1 ! -user $SITE_USER -exec chown -h $SITE_USER:psacln {} +"

      - name: Déployer
        run: |
          $SSH "sudo -u $SITE_USER -H bash -s" << 'EOF'
            set -e
            export APP_ENV=prod
            cd /var/www/vhosts/trouvemoi.eu/httpdocs

            [ -d .git ] || git init -q
            git fetch -q --depth=1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ${{ github.event.workflow_run.head_sha || github.sha }}
            git reset -q --hard FETCH_HEAD
            git log -1 --oneline

            # .env.local.php AVANT les scripts de composer : sinon cache:clear
            # (auto-scripts) tourne avec les variables de l'ancien déploiement
            # et échoue sur toute nouvelle variable (CD #16, 04/10).
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
            composer dump-env prod

            # La CLI PHP du serveur est limitée à 128 Mo : la précompilation
            # des ~200 templates Twig dépasse (CD #17, 04/10). On fixe donc la
            # limite pour les commandes de la console, sans toucher au php.ini.
            PHP="php -d memory_limit=512M"
            $PHP bin/console cache:clear --no-interaction
            $PHP bin/console assets:install public --no-interaction

            # Base créée hors migrations (schema:create) : aucune migration
            # enregistrée alors que le schéma est déjà à jour. On les marque
            # jouées au lieu de les rejouer (« relation already exists »).
            # Une base vide, elle, n'est pas à jour : elle migre normalement.
            executed=$(php bin/console dbal:run-sql "SELECT count(*) AS n FROM doctrine_migration_versions" 2>/dev/null | grep -Eo '^\s*[0-9]+\s*$' | tr -d ' ' || true)
            if [ "${executed:-0}" = 0 ] && php bin/console doctrine:schema:validate --skip-mapping -q; then
              php bin/console doctrine:migrations:version --add --all --no-interaction
            fi
            $PHP bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            $PHP bin/console importmap:install --no-interaction
            $PHP bin/console asset-map:compile
            $PHP bin/console cache:clear --no-interaction
          EOF
