name: Diagnostic serveur

# ---------------------------------------------------------------------------
#  Lancement manuel uniquement (Actions > Diagnostic serveur > Run workflow).
#  LECTURE SEULE : affiche l'état du serveur de déploiement (utilisateur,
#  contenu du vhost, versions PHP/Git/Composer, PostgreSQL) pour préparer
#  la première installation. Ne modifie rien et n'affiche aucun fichier .env.
#  Mêmes secrets que le workflow CD.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    env:
      SSHPASS: ${{ secrets.APP_PASS }}

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: État du serveur
        run: |
          sshpass -e ssh -q -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p ${{ secrets.APP_PORT || '22' }} ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} << 'EOF'
            section() { echo; echo "===== $1 ====="; }

            section "Utilisateur"
            whoami; id; echo "HOME=$HOME"; echo "SHELL=$SHELL"

            section "Vhost trouvemoi.eu"
            ls -la /var/www/vhosts/trouvemoi.eu 2>&1 | head -40

            section "Contenu de httpdocs"
            ls -la /var/www/vhosts/trouvemoi.eu/httpdocs 2>&1 | head -60
            du -sh /var/www/vhosts/trouvemoi.eu/httpdocs 2>&1

            section "Autres dossiers candidats"
            ls -d ~/preprod /var/www/vhosts/*/httpdocs 2>&1

            section "PHP"
            which php; php -v 2>&1 | head -1
            ls /opt/plesk/php/ 2>&1
            php -m 2>&1 | grep -iE '^(pdo_pgsql|intl|ctype|iconv|gd|zip)$'

            section "Outils"
            git --version 2>&1; which composer 2>&1; composer --version 2>&1 | head -1
            ls -la ~/.ssh 2>&1

            section "PostgreSQL"
            psql --version 2>&1; (pg_lsclusters 2>&1 || true)
          EOF

      # Toujours en lecture seule : --dump-sql AFFICHE le SQL qui manquerait à
      # la base pour correspondre au code, sans l'exécuter.
      - name: Base de données
        run: |
          sshpass -e ssh -q -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p ${{ secrets.APP_PORT || '22' }} ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} "sudo -u trouvemoi.eu_w3wfa542s9m -H bash -s" << 'EOF'
            section() { echo; echo "===== $1 ====="; }
            cd /var/www/vhosts/trouvemoi.eu/httpdocs
            export APP_ENV=prod

            section "Code déployé"
            git log -1 --oneline 2>&1

            section "État des migrations"
            php bin/console doctrine:migrations:status 2>&1 | grep -vi deprecat

            section "Écart entre la base et le code (SQL non exécuté)"
            php bin/console doctrine:schema:update --dump-sql 2>&1 | grep -vi deprecat

            section "Volume de données"
            for t in '"user"' provider_profile service booking payment review; do
              printf '%s : ' "$t"
              php bin/console dbal:run-sql "SELECT count(*) AS n FROM $t" 2>&1 | grep -Eo '^\s*[0-9]+\s*$' | tr -d ' ' || echo "?"
            done

            # Les mails passent par la file Messenger « async » : sans worker
            # (messenger:consume) ils restent en base et ne partent jamais.
            section "Mails : configuration (mot de passe masqué)"
            php -r '$e = include ".env.local.php"; foreach (["MAILER_DSN", "MAILER_SENDER", "MESSENGER_TRANSPORT_DSN"] as $k) { echo $k, "=", preg_replace("#//([^:@/]*):[^@]*@#", "//$1:***@", $e[$k] ?? "(absent)"), "\n"; }'

            section "Mails : messages en attente / en échec"
            php bin/console dbal:run-sql "SELECT queue_name, count(*) AS n, min(created_at) AS plus_ancien FROM messenger_messages GROUP BY queue_name" 2>&1 | grep -vi deprecat
            php bin/console messenger:failed:show --max=5 2>&1 | grep -vi deprecat | head -40

            section "Mails : worker et serveurs SMTP locaux"
            pgrep -af "messenger:consume" || echo "aucun worker messenger:consume en cours"
            crontab -l 2>&1 | grep -v '^#' || true
            ss -ltn 2>/dev/null | grep -E ':(25|465|587|1025|8025)\s' || echo "aucun port SMTP local ouvert"
          EOF
