; Limites PHP-FPM du site (Plesk lit ce fichier dans la racine web, prise en
; compte sous 5 minutes). Les photos ne sont plus plafonnées par l'application
; (05/11) : seule cette limite s'applique. post_max_size couvre l'envoi
; simultané d'une couverture et de la galerie.
upload_max_filesize = 50M
post_max_size = 128M
max_file_uploads = 30
; GD/Imagick décompressent l'image en mémoire pour la redimensionner.
memory_limit = 512M
