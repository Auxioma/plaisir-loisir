# Performance (12/10) — à ajouter dans le bloc `server { … }` nginx de trouvemoi.
#
# Constat sur la prod : les fichiers statiques partent SANS compression
# (bootstrap.min.css 232 Ko au lieu d'~30 Ko), SANS en-tête de cache et en
# HTTP/1.1. Ces trois réglages sont le plus gros gain FCP/LCP disponible.
#
#   sudo nano /etc/nginx/sites-available/<site>   # coller ce bloc
#   sudo nginx -t && sudo systemctl reload nginx
#
# 1) HTTP/2 : sur la ligne d'écoute TLS →  listen 443 ssl http2;
#    (nginx >= 1.25 : `listen 443 ssl;` + `http2 on;`)

# 2) Compression gzip des textes (CSS, JS, SVG, JSON, polices non woff2).
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/xml text/plain application/manifest+json;

# 3) Cache navigateur d'un an pour les fichiers versionnés par AssetMapper
#    (/assets/…-<empreinte>.ext : le nom change à chaque modification).
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# Images envoyées par les membres et favicon : cache d'une semaine.
location ^~ /uploads/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}
location = /favicon.ico { expires 30d; access_log off; }
